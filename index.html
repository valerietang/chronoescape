<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Chrono Escape</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🌀 CHRONO ESCAPE <span style="font-size:0.7rem;">quantum collective</span></h1>
            <div class="player-info">
                <span>👤 Fragment: <span id="playerName">Loading...</span></span>
                <span>📦 Truths: <span id="codesFound">0</span>/<span id="totalCodes">11</span></span>
                <span>🏆 Status: <span id="playerRank">Awakening</span></span>
                <span>⏱️ Time: <span id="playTimer">00:00</span></span>
            </div>
            <div class="action-buttons">
                <button id="resetGameBtn" class="reset-btn">🔄 Wipe Memory</button>
                <button id="hintBtn" class="hint-btn">💡 Hint (3 left)</button>
            </div>
        </header>

        <main>
            <div id="multiplayerPanel" class="multiplayer-panel">
                <div id="lobbyView" class="lobby-view">
                    <div class="lobby-buttons">
                        <button id="createGameBtn" class="primary-btn">🎮 BEGIN AWAKENING</button>
                        <button id="joinGameBtn" class="secondary-btn">🔗 JOIN COLLECTIVE</button>
                    </div>
                    <div id="joinSection" style="display:none; margin-top:15px;">
                        <input type="text" id="roomCodeInput" placeholder="Enter 6-digit code" maxlength="6" style="text-transform:uppercase">
                        <button id="confirmJoinBtn">Join Collective</button>
                    </div>
                </div>
                
                <div id="activeGameView" style="display:none;">
                    <div class="room-header">
                        <span>🌀 Nexus: <strong id="roomCodeDisplay">------</strong></span>
                        <span>👥 Fragments: <span id="playerCount">1</span></span>
                        <button id="copyRoomCodeBtn" class="small-btn">📋 Share Nexus Code</button>
                        <button id="leaveGameBtn" class="small-btn danger">🚪 Disconnect</button>
                    </div>
                    <div id="gameView" class="game-view"></div>
                    
                    <div class="flowchart-section">
                        <h3>🌀 THE PATH OF AWAKENING</h3>
                        <div id="flowchartContainer" class="flowchart"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-links">
                <span>💠 Together, you are the answer</span>
                <span>📜 <button id="showLoreBtn" class="lore-btn">View Fragments</button></span>
            </div>
        </footer>
    </div>

    <div id="loreModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>📖 Fragments of Self</h2>
            <div id="loreContent"></div>
        </div>
    </div>

    <div id="endingModal" class="modal ending-modal">
        <div class="modal-content ending-content">
            <div id="endingText" class="ending-text"></div>
            <div class="ending-buttons">
                <button id="shareEndingBtn" class="primary-btn">📋 Share Awakening</button>
                <button id="closeEndingBtn" class="secondary-btn">Continue</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
